          create_credentials_file: false
      - name: Build fresh backup evidence for segment 1
        run: node -e 'const c=require("node:crypto"),e={backup_file_id:process.env.SOLAR_CUP_BACKUP_FILE_ID,source_sheet_id:process.env.SOLAR_CUP_BACKUP_SOURCE_ID,created_at:process.env.SOLAR_CUP_BACKUP_CREATED_AT,title:process.env.SOLAR_CUP_BACKUP_EXPECTED_NAME,size:Number(process.env.SOLAR_CUP_BACKUP_SIZE),verified_at:new Date().toISOString()};e.sha=c.createHash("sha256").update(JSON.stringify([e.backup_file_id,e.source_sheet_id,e.created_at,e.title,e.size])).digest("hex");process.stdout.write(`SOLAR_CUP_BACKUP_EVIDENCE=${JSON.stringify(e)}\n`)' >> "$GITHUB_ENV"
