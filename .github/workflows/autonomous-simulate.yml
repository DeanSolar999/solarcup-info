name: Autonomous Solar Cup simulation
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Immutable run identifier
        required: true
        type: string
permissions: { contents: read }
concurrency: { group: solarcup-production-sheet, cancel-in-progress: false }
jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SOLAR_CUP_BACKUP_FILE_ID: 15WHaxX9Qa-6-tw9XzQ-G0LgkzdxxGDbHqLv8dZ048RM
      SOLAR_CUP_BACKUP_EXPECTED_NAME: 曜日盃TWO_正式資料庫_模擬前備份_source-1kQ-D248ADzN1SxDfQGPkZ-MHhk11sR4zoll3qxL1YdA_2026-08-10T17-31+08
      SOLAR_CUP_BACKUP_CREATED_AT: 2026-08-10T09:31:26.569Z
      SOLAR_CUP_BACKUP_SOURCE_ID: 1kQ-D248ADzN1SxDfQGPkZ-MHhk11sR4zoll3qxL1YdA
      SOLAR_CUP_BACKUP_SIZE: '76499'
      SOLAR_CUP_PROJECTION_BASELINES: '{"3":"23ec2261d059f04eba310a5499654518f562466656d4ea3583b5056f81a47da4","6":"c6b6cda611f9968534acf4da40aeee774f7ae865765ce365061aab1d0199b920","7":"759bf4f7d6a86f17a75f77ea92a5b9199193c4e80ecc3b2eefc9cf2c7a378fca","8":"bd054c98dea579c2e3f73e834f1f0a6ce7c69394d074b2bd918c9c75fc042b4a"}'
    permissions: { contents: read, id-token: write }
    steps:
      - id: safe
        env:
          INPUT_RUN_ID: ${{ inputs.run_id }}
        run: |
          if ! [[ "$INPUT_RUN_ID" =~ ^[A-Za-z][A-Za-z0-9_-]{1,72}$ ]]; then exit 2; fi
          printf 'RUN_ID=%s\n' "$INPUT_RUN_ID" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - id: auth
        uses: google-github-actions/auth@71f986410dfbc7added4569d411d040a91dc6935
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/spreadsheets,https://www.googleapis.com/auth/drive.metadata.readonly,https://www.googleapis.com/auth/devstorage.read_write
          create_credentials_file: false
      - name: Build fresh backup evidence for preflight
        run: node -e 'const c=require("node:crypto"),e={backup_file_id:process.env.SOLAR_CUP_BACKUP_FILE_ID,source_sheet_id:process.env.SOLAR_CUP_BACKUP_SOURCE_ID,created_at:process.env.SOLAR_CUP_BACKUP_CREATED_AT,title:process.env.SOLAR_CUP_BACKUP_EXPECTED_NAME,size:Number(process.env.SOLAR_CUP_BACKUP_SIZE),verified_at:new Date().toISOString()};e.sha=c.createHash("sha256").update(JSON.stringify([e.backup_file_id,e.source_sheet_id,e.created_at,e.title,e.size])).digest("hex");process.stdout.write(`SOLAR_CUP_BACKUP_EVIDENCE=${JSON.stringify(e)}\n`)' >> "$GITHUB_ENV"
      - env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          SOLAR_CUP_SPREADSHEET_ID: 1kQ-D248ADzN1SxDfQGPkZ-MHhk11sR4zoll3qxL1YdA
          SOLAR_CUP_GCS_BUCKET: ${{ vars.SOLAR_CUP_GCS_BUCKET }}
          SOLAR_CUP_GCS_LEASE_OBJECT: solarcup-simulation/production/lease.json
          SOLAR_CUP_GCS_STATE_PREFIX: solarcup-simulation/runs
        run: node simulation/runner.js run --armed --autonomous --preflight-only --run-id "$RUN_ID"
  simulate:
    needs: preflight
    if: needs.preflight.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    environment: production
