      SOLAR_CUP_PROJECTION_BASELINES: '{"3":"23ec2261d059f04eba310a5499654518f562466656d4ea3583b5056f81a47da4","6":"c6b6cda611f9968534acf4da40aeee774f7ae865765ce365061aab1d0199b920","7":"759bf4f7d6a86f17a75f77ea92a5b9199193c4e80ecc3b2eefc9cf2c7a378fca","8":"bd054c98dea579c2e3f73e834f1f0a6ce7c69394d074b2bd918c9c75fc042b4a"}'
    permissions: { contents: read, id-token: write }
    steps:
      - id: safe
