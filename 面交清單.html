<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SOLAR CUP TWO · 服裝發貨追蹤</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --navy: #152A42; --navy2: #1E3D5C;
  --bg: #EEF1F7; --card: #FFFFFF;
  --text: #1A2230; --text2: #5A6880; --text3: #8A98AC;
  --rule: #D8DDE8; --rule2: #E8EBF2;
  --green: #1A7A4A; --green-bg: #E6F5ED;
  --amber: #7A5200; --amber-bg: #FFF3CC;
  --red: #8A2020; --red-bg: #FDEAEA;
  --purple: #5A35B0; --purple-bg: #EEE8FF;
  --cs-bg:#E5E9EF; --cs-fg:#3E5270;
  --cg-bg:#FEF3CE; --cg-fg:#7A5A00;
  --cn-bg:#D5E4F5; --cn-fg:#193E70;
  --cp-bg:#FAE0EB; --cp-fg:#9B3058;
}

body { background: var(--bg); font-family: -apple-system, 'PingFang TC', 'Helvetica Neue', sans-serif; color: var(--text); min-height: 100vh; }

.app-header {
  background: var(--navy); color: #fff; padding: 14px 16px 12px;
  position: sticky; top: 0; z-index: 100;
  padding-top: max(14px, env(safe-area-inset-top));
}
.header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.header-title { font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; opacity: .6; }
.header-sub { font-size: 17px; font-weight: 900; }
.header-count { font-size: 11px; opacity: .6; text-align: right; line-height: 1.6; }
.progress-wrap { background: rgba(255,255,255,.15); border-radius: 6px; height: 6px; }
.progress-bar { background: #4ECCA3; border-radius: 6px; height: 6px; transition: width .4s ease; }
.progress-label { display: flex; justify-content: space-between; margin-top: 5px; font-size: 11px; opacity: .65; }

.tabs { display: flex; background: var(--card); border-bottom: 1px solid var(--rule); position: sticky; top: calc(80px + max(0px, env(safe-area-inset-top))); z-index: 90; }
.tab { flex: 1; padding: 10px 4px; text-align: center; font-size: 12px; font-weight: 700; color: var(--text3); border-bottom: 2.5px solid transparent; cursor: pointer; }
.tab.active { color: var(--navy); border-color: var(--navy); }

.type-divider {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 12px 6px; font-size: 10px; font-weight: 800;
  letter-spacing: .1em; text-transform: uppercase; color: var(--text3);
}
.type-divider::after { content:''; flex:1; height:1px; background:var(--rule); }

.section { margin: 0 12px 12px; }
.section-hdr {
  color: #fff; border-radius: 10px 10px 0 0;
  padding: 10px 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.section-hdr.type-session { background: var(--navy2); }
.section-hdr.type-spot    { background: #2A5020; }
.section-hdr.type-711     { background: #7A5200; }
.section-hdr.type-gather  { background: #2E3A6E; }

.section-tag { font-size: 9px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; background: #4ECCA3; color: var(--navy); border-radius: 4px; padding: 1px 6px; flex-shrink:0; }
.section-tag.t-event { background: #FFD166; color: #5A3600; }
.section-tag.t-ship  { background: #FCA5A5; color: #7A2020; }

.section-name { font-size: 14px; font-weight: 800; }
.section-info { font-size: 11px; opacity: .65; margin-left: auto; text-align: right; line-height: 1.4; }
.section-body { background: var(--card); overflow: hidden; }
.section-footer { background: var(--rule2); padding: 6px 14px; font-size: 11px; color: var(--text3); display: flex; justify-content: space-between; border-radius: 0 0 10px 10px; }
.section-footer strong { color: var(--navy); }

.person-card {
  padding: 12px 14px; border-bottom: 1px solid var(--rule2);
  position: relative; transition: background .2s;
  cursor: pointer; user-select: none; -webkit-user-select: none;
}
.person-card:last-child { border-bottom: none; }
.person-card.pressing { background: #F0F6FF; }
.person-card.received { background: var(--green-bg); }
.person-card.hidden   { display: none; }

.card-top { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
.card-name { font-size: 16px; font-weight: 800; line-height: 1.2; }
.received .card-name { text-decoration: line-through; opacity: .6; }
.card-badges { display: flex; flex-wrap: wrap; gap: 4px; margin-left: auto; flex-shrink:0; max-width: 55%; justify-content: flex-end; }

.badge { font-size: 10px; font-weight: 700; border-radius: 12px; padding: 2px 8px; white-space: nowrap; }
.badge-received { background: var(--green); color: #fff; }
.badge-waitlist { background: var(--red-bg); color: var(--red); }
.badge-alert    { background: var(--amber-bg); color: var(--amber); }
.badge-extra    { background: var(--purple-bg); color: var(--purple); }

.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 7px; }
.chip { display: inline-block; border-radius: 4px; padding: 2px 7px; font-size: 11px; font-weight: 700; }
.cs { background: var(--cs-bg); color: var(--cs-fg); }
.cg { background: var(--cg-bg); color: var(--cg-fg); }
.cn { background: var(--cn-bg); color: var(--cn-fg); }
.cp { background: var(--cp-bg); color: var(--cp-fg); }

.card-bottom { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text2); flex-wrap: wrap; }
.card-qty { font-weight: 700; color: var(--text); }
.dot { color: var(--rule); }
.card-note { font-size: 11px; color: var(--amber); font-weight: 600; }
.method-pill { border-radius: 4px; padding: 1px 6px; font-size: 10px; font-weight: 700; }
.m-spot   { background: #E6F5ED; color: #1A7A4A; }
.m-gather { background: var(--rule2); color: var(--text3); }
.m-711    { background: var(--amber-bg); color: var(--amber); }

.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 200; opacity: 0; pointer-events: none; transition: opacity .25s; }
.overlay.show { opacity: 1; pointer-events: all; }

.sheet { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-radius: 18px 18px 0 0; z-index: 210; transform: translateY(100%); transition: transform .3s cubic-bezier(.32,0,.67,0); padding-bottom: max(20px, env(safe-area-inset-bottom)); max-height: 90vh; overflow-y: auto; }
.sheet.show { transform: translateY(0); }
.sheet-handle { width: 36px; height: 4px; background: var(--rule); border-radius: 2px; margin: 10px auto 6px; }
.sheet-person { padding: 8px 20px 14px; border-bottom: 1px solid var(--rule2); }
.sheet-person-name { font-size: 18px; font-weight: 900; }
.sheet-person-detail { font-size: 12px; color: var(--text2); margin-top: 2px; }

.sheet-btn {
  display: flex; align-items: center; gap: 14px;
  padding: 16px 20px; border: none; background: transparent; width: 100%;
  font-size: 16px; font-weight: 600; color: var(--text); cursor: pointer;
  border-bottom: 1px solid var(--rule2); text-align: left;
}
.sheet-btn:last-child { border-bottom: none; }
.sheet-btn.cancel { color: var(--text3); font-weight: 500; }
.sheet-btn .btn-icon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
.icon-receive { background: var(--green-bg); }
.icon-undo    { background: var(--purple-bg); }
.icon-move    { background: #E8F0FE; }
.icon-hide    { background: var(--red-bg); }
.icon-cancel  { background: var(--rule2); }

.move-sheet-item { display: flex; align-items: center; padding: 14px 20px; cursor: pointer; border-bottom: 1px solid var(--rule2); gap: 12px; }
.move-sheet-item:active { background: var(--bg); }
.move-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--navy2); flex-shrink: 0; }
.move-label { font-size: 15px; font-weight: 700; }
.move-sub { font-size: 12px; color: var(--text3); margin-top: 1px; }
.sheet-title { padding: 14px 20px 10px; font-size: 13px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--text3); border-bottom: 1px solid var(--rule2); }
</style>
</head>
<body>

<div class="app-header">
  <div class="header-top">
    <div><div class="header-title">SOLAR CUP TWO</div><div class="header-sub">服裝發貨追蹤</div></div>
    <div class="header-count">37 筆訂單<br>113 件</div>
  </div>
  <div class="progress-wrap"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
  <div class="progress-label"><span id="progressText">0 / 37 已完成</span><span>長按姓名 → 操作</span></div>
</div>

<div class="tabs">
  <div class="tab active" data-tab="all">全部</div>
  <div class="tab" data-tab="pending">待領</div>
  <div class="tab" data-tab="done">已完成</div>
</div>

<div id="app"></div>

<div class="overlay" id="overlay"></div>

<div class="sheet" id="actionSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-person" id="sheetPersonInfo"></div>
  <button class="sheet-btn" id="btnReceive"><span class="btn-icon icon-receive">✓</span><span id="btnReceiveLabel">標記已領取</span></button>
  <button class="sheet-btn" id="btnUndo" style="display:none"><span class="btn-icon icon-undo">↩</span>取消完成狀態</button>
  <button class="sheet-btn" id="btnMove"><span class="btn-icon icon-move">↕</span>移動到其他分類</button>
  <button class="sheet-btn" id="btnHide"><span class="btn-icon icon-hide">✕</span>從此清單移除</button>
  <button class="sheet-btn cancel" id="btnCancel"><span class="btn-icon icon-cancel">—</span>取消</button>
</div>

<div class="sheet" id="moveSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-title">移動到</div>
  <div id="moveOptions"></div>
</div>

<script>
const P = {
  // 本週球場面交
  kaili:        { name:'凱力',         chips:[['cg','金','L'],['cg','金','XL']],                                                                  qty:2,  amt:760,   method:'gather' },
  zihe:         { name:'子昊',         chips:[['cs','銀','M'],['cg','金','M'],['cn','藍','M'],['cp','粉','M']],                                   qty:4,  amt:1520,  method:'spot' },
  lici:         { name:'李慈',         chips:[['cg','金','XL'],['cn','藍','L'],['cp','粉','XL']],                                                 qty:3,  amt:1140,  method:'gather' },

  pengpeng:     { name:'蓬蓬',         chips:[['cn','藍','2XL'],['cp','粉','2XL']],                                                              qty:2,  amt:820,   method:'711',   alert:'改面交省 $60' },
  abin:         { name:'阿斌',         chips:[['cg','金','XL']],                                                                                  qty:1,  amt:380,   method:'gather' },
  weixiaokai:   { name:'魏小開',       chips:[['cs','銀','3L'],['cg','金','3L'],['cp','粉','3L']],                                               qty:3,  amt:1140,  method:'gather' },
  lion:         { name:'Lion',         chips:[['cg','金','2XL'],['cg','金','2XL']],                                                              qty:2,  amt:760,   method:'gather' },
  baozi:        { name:'包子',         chips:[['cn','藍','2XL'],['cp','粉','2XL']],                                                              qty:2,  amt:760,   method:'spot',  waitlist:true },
  cn:           { name:'CN',           chips:[['cg','金','XL'],['cn','藍','XL'],['cp','粉','XL']],                                               qty:3,  amt:1140,  method:'gather' },
  kaiwen:       { name:'凱文',         chips:[['cs','銀','2XL']],                                                                                 qty:1,  amt:380,   method:'spot' },
  // 現場取貨（賽事日）
  caizhongxian: { name:'蔡忠憲',       chips:[['cn','藍','2XL'],['cp','粉','2XL']],                                                             qty:2,  amt:760,   method:'spot' },
  dsd:          { name:'dsd',          chips:[['cs','銀','M']],                                                                                   qty:1,  amt:380,   method:'spot' },
  heng:         { name:'Heng',         chips:[['cs','銀','2XL'],['cn','藍','2XL']],                                                             qty:2,  amt:760,   method:'spot' },
  azhang:       { name:'阿璋',         chips:[['cn','藍','3L'],['cp','粉','2XL']],                                                              qty:2,  amt:760,   method:'spot' },
  gaga:         { name:'嘎嘎',         chips:[['cn','藍','L']],                                                                                  qty:1,  amt:380,   method:'spot' },
  abao:         { name:'阿寶',         chips:[['cp','粉','XL']],                                                                                  qty:1,  amt:380,   method:'spot' },
  chenjuncai:   { name:'陳俊才',       chips:[['cs','銀','S'],['cs','銀','M'],['cn','藍','M'],['cp','粉','S']],                                 qty:4,  amt:1520,  method:'spot' },
  youguaze:     { name:'游瓜澤',       chips:[['cn','藍','XL',2]],                                                                               qty:2,  amt:760,   method:'spot' },
  hepu:         { name:'和蒲',         chips:[['cs','銀','M']],                                                                                  qty:1,  amt:380,   method:'spot' },
  benlin:       { name:'BenLin',       chips:[['cs','銀','L'],['cn','藍','L']],                                                                 qty:2,  amt:760,   method:'spot' },
  huangwenwen:  { name:'黃文文',       chips:[['cg','金','M'],['cn','藍','M']],                                                                 qty:2,  amt:760,   method:'spot' },
  // 7-11 寄送
  xiaoahe:      { name:'小阿和',       chips:[['cn','藍','2XL',2]],                                                                              qty:2,  amt:820,   method:'711',  note:'末5碼：97191' },
  zalston:      { name:'Zalston Hsieh',chips:[['cg','金','M'],['cn','藍','M',2]],                                                               qty:3,  amt:1200,  method:'711',  note:'末5碼：10930' },
  chenyuren:    { name:'陳禹任',       chips:[['cs','銀','4L'],['cn','藍','4L'],['cp','粉','4L']],                                              qty:3,  amt:1200,  method:'711',  note:'末5碼：77141' },
  luke:         { name:'路克',         chips:[['cs','銀','M'],['cn','藍','M']],                                                                 qty:2,  amt:820,   method:'711',  note:'美慈門市 158945', alert:'改面交省運費' },
  chenyuzhang:  { name:'陳昱彰',       chips:[['cs','銀','L'],['cg','金','L']],                                                                 qty:2,  amt:820,   method:'711',  note:'末5碼：31179' },
  nan:          { name:'Nan',          chips:[['cs','銀','4L'],['cg','金','4L'],['cn','藍','4L'],['cp','粉','4L']],                             qty:4,  amt:1580,  method:'711' },
  // 球聚領取
  wangduoduo:   { name:'王多多',       chips:[['cs','銀','XL'],['cg','金','XL']],                                                              qty:2,  amt:760,   method:'gather' },
  baiwei:       { name:'白維',         chips:[['cs','銀','2XL',2],['cg','金','2XL'],['cn','藍','2XL',2],['cp','粉','2XL']],                    qty:6,  amt:2280,  method:'gather' },
  zaizai:       { name:'仔仔',         chips:[['cs','銀','4L']],                                                                                  qty:1,  amt:380,   method:'gather' },
  xiaoxiang:    { name:'小翔',         chips:[['cg','金','XL']],                                                                                  qty:1,  amt:380,   method:'gather' },
  oneplus:      { name:'1+',           chips:[['cg','金','L'],['cp','粉','L']],                                                                  qty:2,  amt:760,   method:'gather' },
  jimlin:       { name:'JIM LIN',      chips:[['cg','金','L'],['cn','藍','L'],['cp','粉','L']],                                                 qty:3,  amt:1140,  method:'gather' },
  kangen:       { name:'康恩',         chips:[['cs','銀','L',3],['cg','金','M'],['cg','金','L'],['cn','藍','L',9],['cn','藍','XL',2],['cn','藍','M',3],['cn','藍','2XL'],['cp','粉','L',6],['cp','粉','M',4],['cp','粉','XL'],['cp','粉','2XL']], qty:32, amt:12160, method:'gather' },
};

const SECTIONS = [
  { id:'monday',    type:'session', label:'月曜南港',      tag:'',      tagCls:'',        info:'08/10(一) 20:00\n南港運動中心', persons:['kaili'] },
  { id:'tuesday',   type:'session', label:'火曜延平',      tag:'明日',  tagCls:'',        info:'08/11(二) 19:00\n延平國小',     persons:['abao','zihe','xiaocao','cn','pengpeng','oneplus','benlin','luke'] },
  { id:'wednesday', type:'session', label:'水曜二重',      tag:'',      tagCls:'',        info:'08/12(三) 19:00\n二重國小',     persons:['zihe','lici','congcong','xiaocao','xiaoluo','kaili','pengpeng'] },
  { id:'thursday',  type:'session', label:'木曜大同',      tag:'',      tagCls:'',        info:'08/13(四) 20:00\n大同運動中心', persons:['abin','weixiaokai','lion','baozi'] },
  { id:'saturday',  type:'session', label:'土曜興雅',      tag:'',      tagCls:'',        info:'08/15(六) 17:30\n興雅國小',     persons:['cn','kaiwen','kaili'] },
  { id:'spot',      type:'spot',    label:'曜日盃現場取貨', tag:'賽事日', tagCls:'t-event', info:'08/22 賽事當日\n現場發放',      actionLabel:'標記已領取', persons:['caizhongxian','dsd','heng','azhang','gaga','abao','chenjuncai','youguaze','hepu','benlin','huangwenwen'] },
  { id:'s711',      type:'711',     label:'7-11 店到店',   tag:'寄送',   tagCls:'t-ship',  info:'確認取件\n對帳匯款末5碼',        actionLabel:'標記已寄出', showNote:true, persons:['xiaoahe','zalston','chenyuren','luke','chenyuzhang','nan'] },
  { id:'gather',    type:'gather',  label:'球聚面交',       tag:'',       tagCls:'',         info:'下次球聚時\n交予本人',           actionLabel:'標記已領取', persons:['wangduoduo','baiwei','zaizai','xiaoxiang','oneplus','jimlin','kangen'] },
];

const STORAGE_KEY = 'sc2_delivery_v2';
// 2026-08-21 同步團長手機的勾選進度（25/36 已完成）：裝置無 localStorage 紀錄時以此為起點
const DEFAULT_STATE = {
  received: {
    // 火曜延平 08/11
    abao:true, zihe:true, xiaocao:true, pengpeng:true, oneplus:true, benlin:true,
    // 水曜二重 08/12
    lici:true, congcong:true, xiaoluo:true, kaili:true, jimlin:true, xiaoxiang:true,
    // 木曜大同 08/13
    abin:true, weixiaokai:true, lion:true,
    // 土曜興雅 08/15
    kaiwen:true, hepu:true,
    // 現場取貨（已提前領取）
    caizhongxian:true, heng:true, azhang:true, gaga:true, youguaze:true, huangwenwen:true,
    // 球聚面交
    wangduoduo:true, kangen:true,
  },
  hidden: {
    tuesday:  { cn:true, luke:true },
    thursday: { baozi:true },
    saturday: { kaili:true },
    spot:     { hepu:true },
    gather:   { jimlin:true, xiaoxiang:true },
  },
  extras: {
    wednesday: ['kaili','jimlin','xiaoxiang'],
    saturday:  ['hepu'],
  },
};
let state = JSON.parse(JSON.stringify(DEFAULT_STATE));
function loadState()  { try { const s = JSON.parse(localStorage.getItem(STORAGE_KEY)); if (s) state = s; } catch(e) {} }
function saveState()  { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

const isReceived = pid => !!state.received[pid];
const isHidden   = (sid, pid) => !!(state.hidden[sid] && state.hidden[sid][pid]);
const isExtra    = (sid, pid) => !!(state.extras[sid] && state.extras[sid].includes(pid));

function personsForSection(sec) {
  return [...new Set([...sec.persons, ...(state.extras[sec.id] || [])])].filter(pid => !isHidden(sec.id, pid));
}

let currentFilter = 'all';
function cardVisible(pid) {
  if (currentFilter === 'pending') return !isReceived(pid);
  if (currentFilter === 'done')    return  isReceived(pid);
  return true;
}

function allPersonIds() {
  const seen = new Set();
  SECTIONS.forEach(s => personsForSection(s).forEach(pid => seen.add(pid)));
  return [...seen];
}

function renderChips(chips) {
  return chips.map(([cls, label, size, n]) =>
    `<span class="chip ${cls}">${label} ${size}${n > 1 ? ' ×'+n : ''}</span>`
  ).join('');
}

function methodPill(m) {
  if (m === 'spot')   return '<span class="method-pill m-spot">現場</span>';
  if (m === '711')    return '<span class="method-pill m-711">7-11</span>';
  return '<span class="method-pill m-gather">球聚</span>';
}

function renderCard(sid, pid, showNote) {
  const p = P[pid]; if (!p) return '';
  const recv  = isReceived(pid);
  const extra = isExtra(sid, pid);
  const vis   = cardVisible(pid);
  const cls   = ['person-card', recv ? 'received' : '', !vis ? 'hidden' : ''].filter(Boolean).join(' ');
  const badges = [
    recv         ? '<span class="badge badge-received">✓ 已完成</span>' : '',
    p.waitlist   ? '<span class="badge badge-waitlist">候補</span>'     : '',
    p.alert&&!recv ? `<span class="badge badge-alert">⚡ ${p.alert}</span>` : '',
    extra        ? '<span class="badge badge-extra">移入</span>'        : '',
  ].filter(Boolean).join('');
  const noteHtml = showNote && p.note ? `<span class="dot">·</span><span class="card-note">${p.note}</span>` : '';
  return `
  <div class="${cls}" data-sid="${sid}" data-pid="${pid}" id="card-${sid}-${pid}">
    <div class="card-top">
      <div class="card-name">${p.name}</div>
      ${badges ? `<div class="card-badges">${badges}</div>` : ''}
    </div>
    <div class="chips">${renderChips(p.chips)}</div>
    <div class="card-bottom">
      <span class="card-qty">${p.qty} 件</span><span class="dot">·</span>
      <span>$${p.amt.toLocaleString()}</span><span class="dot">·</span>
      ${methodPill(p.method)}${noteHtml}
    </div>
  </div>`;
}

function renderSection(sec) {
  const persons = personsForSection(sec); if (!persons.length) return '';
  const cards = persons.map(pid => renderCard(sec.id, pid, sec.showNote)).join('');
  const done  = persons.filter(pid => isReceived(pid)).length;
  const tagHtml = sec.tag ? `<span class="section-tag ${sec.tagCls}">${sec.tag}</span>` : '';
  return `
  <div class="section" data-section-id="${sec.id}">
    <div class="section-hdr type-${sec.type}">
      ${tagHtml}
      <div class="section-name">${sec.label}</div>
      <div class="section-info">${sec.info.replace('\n','<br>')}</div>
    </div>
    <div class="section-body" id="body-${sec.id}">${cards}</div>
    <div class="section-footer">
      <span>完成 <strong id="done-${sec.id}">${done}</strong> / ${persons.length}</span>
      <span>${done === persons.length && persons.length > 0 ? '✓ 全部完成' : ''}</span>
    </div>
  </div>`;
}

function render() {
  const sessionSecs  = SECTIONS.filter(s => s.type === 'session');
  const deliverySecs = SECTIONS.filter(s => s.type !== 'session');
  document.getElementById('app').innerHTML =
    '<div class="type-divider">本週球場面交</div>' +
    sessionSecs.map(renderSection).join('') +
    '<div class="type-divider">其他交貨方式</div>' +
    deliverySecs.map(renderSection).join('');
  bindCards();
  updateProgress();
}

function updateProgress() {
  const allPids = allPersonIds();
  const total   = allPids.length;
  const done    = allPids.filter(pid => isReceived(pid)).length;
  document.getElementById('progressBar').style.width = (total ? done/total*100 : 0) + '%';
  document.getElementById('progressText').textContent = `${done} / ${total} 已完成`;
  SECTIONS.forEach(sec => {
    const el = document.getElementById('done-' + sec.id);
    if (el) el.textContent = personsForSection(sec).filter(pid => isReceived(pid)).length;
  });
}

let pressTimer = null, pressTarget = null;
function bindCards() {
  document.querySelectorAll('.person-card').forEach(card => {
    card.addEventListener('touchstart', onTouchStart, { passive:true });
    card.addEventListener('touchend',   onTouchEnd);
    card.addEventListener('touchmove',  onTouchMove, { passive:true });
  });
}
function onTouchStart(e) {
  const card = e.currentTarget; pressTarget = card;
  pressTimer = setTimeout(() => {
    card.classList.add('pressing');
    if (navigator.vibrate) navigator.vibrate(40);
    openActionSheet(card.dataset.sid, card.dataset.pid);
    pressTimer = null;
  }, 550);
}
function onTouchEnd()  { if (pressTimer) { clearTimeout(pressTimer); pressTimer=null; } if (pressTarget) { pressTarget.classList.remove('pressing'); pressTarget=null; } }
function onTouchMove() { if (pressTimer) { clearTimeout(pressTimer); pressTimer=null; } }

let activeSid=null, activePid=null;
function openActionSheet(sid, pid) {
  activeSid=sid; activePid=pid;
  const p    = P[pid];
  const recv = isReceived(pid);
  const sec  = SECTIONS.find(s => s.id === sid);
  document.getElementById('sheetPersonInfo').innerHTML =
    `<div class="sheet-person-name">${p.name}</div>
     <div class="sheet-person-detail">${p.chips.map(([,l,s,n])=>l+' '+s+(n>1?'×'+n:'')).join('　')} · ${p.qty}件 $${p.amt.toLocaleString()}</div>`;
  document.getElementById('btnReceiveLabel').textContent = sec?.actionLabel || '標記已領取';
  document.getElementById('btnReceive').style.display = recv ? 'none' : '';
  document.getElementById('btnUndo').style.display    = recv ? ''     : 'none';
  document.getElementById('btnMove').style.display    = '';
  showSheet('actionSheet');
}

function showSheet(id)   { document.getElementById('overlay').classList.add('show'); document.getElementById(id).classList.add('show'); }
function hideSheet(id)   { document.getElementById(id).classList.remove('show'); if (!document.querySelector('.sheet.show')) document.getElementById('overlay').classList.remove('show'); }
function hideAllSheets() { document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('show')); document.getElementById('overlay').classList.remove('show'); }

document.getElementById('overlay').addEventListener('click', hideAllSheets);
document.getElementById('btnCancel').addEventListener('click', hideAllSheets);
document.getElementById('btnReceive').addEventListener('click', () => {
  state.received[activePid]=true; saveState(); hideAllSheets();
  rerenderCard(activeSid, activePid); updateProgress();
});
document.getElementById('btnUndo').addEventListener('click', () => {
  delete state.received[activePid]; saveState(); hideAllSheets();
  rerenderCard(activeSid, activePid); updateProgress();
});
document.getElementById('btnHide').addEventListener('click', () => {
  if (!state.hidden[activeSid]) state.hidden[activeSid]={};
  state.hidden[activeSid][activePid]=true; saveState(); hideAllSheets();
  const el = document.getElementById(`card-${activeSid}-${activePid}`);
  if (el) el.remove(); updateProgress();
});
document.getElementById('btnMove').addEventListener('click', () => { hideSheet('actionSheet'); openMoveSheet(); });

const SECTION_COLORS = {session:'#1E3D5C', spot:'#2A5020', '711':'#7A5200', gather:'#2E3A6E'};
function openMoveSheet() {
  const opts = SECTIONS.filter(s => s.id !== activeSid).map(s => `
    <div class="move-sheet-item" data-target="${s.id}">
      <div class="move-dot" style="background:${SECTION_COLORS[s.type]||'#1E3D5C'}"></div>
      <div><div class="move-label">${s.label}</div><div class="move-sub">${s.info.replace('\n',' · ')}</div></div>
    </div>`).join('');
  document.getElementById('moveOptions').innerHTML = opts;
  document.querySelectorAll('.move-sheet-item').forEach(item => {
    item.addEventListener('click', () => {
      const t = item.dataset.target;
      if (!state.hidden[activeSid]) state.hidden[activeSid]={};
      state.hidden[activeSid][activePid]=true;
      if (!state.extras[t]) state.extras[t]=[];
      if (!state.extras[t].includes(activePid)) state.extras[t].push(activePid);
      saveState(); hideAllSheets(); render();
    });
  });
  showSheet('moveSheet');
}

function rerenderCard(sid, pid) {
  const el = document.getElementById(`card-${sid}-${pid}`); if (!el) return;
  const sec = SECTIONS.find(s => s.id===sid);
  el.outerHTML = renderCard(sid, pid, sec?.showNote);
  const newEl = document.getElementById(`card-${sid}-${pid}`);
  if (newEl) {
    newEl.addEventListener('touchstart', onTouchStart, { passive:true });
    newEl.addEventListener('touchend',   onTouchEnd);
    newEl.addEventListener('touchmove',  onTouchMove, { passive:true });
  }
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active'); currentFilter = tab.dataset.tab; render();
  });
});

let headerTimer=null;
document.querySelector('.app-header').addEventListener('touchstart', e => {
  if (e.target.closest('.progress-wrap,.progress-label')) {
    headerTimer = setTimeout(() => {
      if (confirm('重置所有狀態？')) { state={received:{},hidden:{},extras:{}}; saveState(); render(); }
    }, 2000);
  }
});
document.querySelector('.app-header').addEventListener('touchend', () => clearTimeout(headerTimer));

loadState();
render();
</script>
</body>
</html>
