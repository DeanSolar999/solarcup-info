<title>SOLAR CUP TWO ｜ 力場擂台 — 標題</title>

<style>
 *{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;overflow:hidden}
 body{font-family:'DotGothic16',monospace;position:relative;background:#0a0e2a}
 #bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:pixelated;z-index:0}
 /* 文字可讀性暗幕 */
 .scrim{position:absolute;inset:0;z-index:1;pointer-events:none;
   background:radial-gradient(120% 70% at 50% 42%,rgba(4,8,26,.55),transparent 60%),
     linear-gradient(180deg,rgba(4,8,26,.35),transparent 30%,transparent 70%,rgba(4,8,26,.45))}
 .wrap{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
 .crest{font-family:'Press Start 2P',monospace;font-size:11px;letter-spacing:.28em;color:#fff;
   text-shadow:2px 2px 0 #1b3a6b,0 0 10px rgba(0,0,0,.6);margin-bottom:20px}
 .logo{font-family:'Press Start 2P',monospace;line-height:1.14;font-size:clamp(30px,8.5vw,76px);
   background:linear-gradient(180deg,#fff6c8 0%,#ffe27a 30%,#ffb020 52%,#a9631a 56%,#ffcf3a 70%,#fff3b0 100%);
   -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:2.5px #5a2f08;
   filter:drop-shadow(4px 5px 0 rgba(30,12,0,.7)) drop-shadow(0 0 16px rgba(255,190,60,.55))}
 .logo .two{display:block;font-size:.62em;-webkit-text-stroke:2.5px #123a6b;letter-spacing:.05em;margin-top:8px;
   background:linear-gradient(180deg,#fff 0%,#cfe6ff 45%,#5a9be6 55%,#dff0ff 100%);
   -webkit-background-clip:text;background-clip:text;color:transparent;
   filter:drop-shadow(3px 4px 0 rgba(0,10,40,.7))}
 .subplate{margin-top:28px;display:inline-block;padding:9px 28px;font-family:'DotGothic16',monospace;
   font-size:clamp(18px,4vw,30px);letter-spacing:.35em;color:#fff8dc;
   background:linear-gradient(180deg,#7a1fb0,#4a1170);border:3px solid #ffd24a;border-radius:4px;
   box-shadow:0 0 0 3px #2a0a45,4px 4px 0 3px #2a0a45,inset 0 0 12px rgba(0,0,0,.4);text-shadow:2px 2px 0 #2a0a45}
 .badges{position:absolute;top:22px;right:24px;z-index:6}
 .badge{display:inline-block;font-family:'Press Start 2P',monospace;font-size:9px;color:#2a0a45;
   background:linear-gradient(180deg,#ffe27a,#ffb020);border:2px solid #5a2f08;border-radius:3px;
   padding:6px 9px;margin-left:6px;box-shadow:2px 2px 0 rgba(0,0,0,.35)}
 .menu{position:absolute;bottom:8%;left:50%;transform:translateX(-50%);z-index:6;
   font-family:'DotGothic16',monospace;font-size:clamp(15px,3.4vw,22px);color:#fff;letter-spacing:.15em;
   text-shadow:2px 2px 0 #000,0 0 8px rgba(0,0,0,.6)}
 .menu .arw{color:#ffd24a;animation:blink 1s steps(1) infinite;margin-right:8px}
 @keyframes blink{50%{opacity:0}}
 .toggle{position:absolute;top:22px;left:24px;z-index:7;font-family:'DotGothic16',monospace;font-size:13px;
   color:#0a0e2a;background:#ffd24a;border:2px solid #5a2f08;border-radius:4px;padding:7px 12px;cursor:pointer;
   box-shadow:2px 2px 0 rgba(0,0,0,.35)}
 .foot{position:absolute;bottom:2%;width:100%;text-align:center;font-size:10px;color:rgba(255,255,255,.75);z-index:6}
